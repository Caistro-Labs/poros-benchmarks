# The logs behind the check before a run. Pointers only: every number it decides from is
# read from the log it names by scripts/build_plan_cells.py, which writes
# poros/plan/cells.json (a test fails if that file drifts from this one).
#
# Per cell:
#   key      what the run was. A {ptr} is read from the receipt (or from
#            `receipt`, another file of the same run); a literal is allowed
#            only where no receipt of the run records the value, with a
#            comment naming where it does come from (the committed script).
#   fields   measured values: ptr (RFC 6901), unit (GiB | GB | MB | bytes | s),
#            optional `receipt` (another file of the same run) and `select`
#            (a JSONL file: the first row whose keys match), and `method`
#            (what a figure says of itself).
#   host     context the plan shows as a warning.
#   selfcheck  whether the startup parity self-check ran (null: unknown);
#            it moves load_time, peak host RAM and the reserved VRAM peak.
#   path     the loop it trained (poros.core.config.train_path): sequential when absent;
#            efficient or fast for block-major accumulation's two paths. A config plans from its
#            own path's receipts; else from the sequential ones plus what its path holds on top
#            (poros.plan.path_extra), as estimates, with a warning.
#
# A cell is a run that completed. `gpu` is the name torch reported.
# The Mac's cells are in metal/m4_16gb/plan_sources.yaml, from scripts/metal/figures.py.

- id: qwen2.5-32b-rtx5090-synthetic
  receipt: docs/validation/consumer-5090/nf4_5090_syn/summary.json
  key:
    model: {ptr: /model}
    quantization: {ptr: /quantization}
    seq_len: {ptr: /seq_len}
    block_size: {ptr: /block_size}
    batch: 1             # scripts/bf16_blog_pass.py: PorosConfig default
    grad_accum: 8        # scripts/bf16_blog_pass.py: PorosConfig default
    lora_rank: 16        # scripts/bf16_blog_pass.py
    lora_dropout: 0.0    # scripts/bf16_blog_pass.py
    load_strategy: gpu   # predates nf4_load_strategy: the gpu load was the only one
    selfcheck: true       # events.jsonl setup timestamp 2026-06-10: before 0.2.2 (2026-07-15) made it opt-in
    entry: dense
    gpu: {ptr: /gpu}
  fields:
    peak_vram_allocated: {ptr: /data/peak_vram_allocated_gb, unit: GB,
                          receipt: docs/validation/consumer-5090/nf4_5090_syn/events.jsonl,
                          select: {event_type: teardown}}
    peak_vram_reserved: {ptr: /data/peak_vram_reserved_gb, unit: GB,
                         receipt: docs/validation/consumer-5090/nf4_5090_syn/events.jsonl,
                         select: {event_type: teardown}}
    s_per_step: {ptr: /s_per_step, unit: s}
    load_time: {ptr: /setup_seconds, unit: s}


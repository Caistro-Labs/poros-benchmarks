model_name_or_path: Qwen/Qwen2.5-72B
dataset: oasst_full64.jsonl
quantization: nf4
max_seq_length: 512
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
learning_rate: 2.0e-05
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 0
lr_scheduler: constant
gradient_accumulation_steps: 8
per_device_batch_size: 1
max_steps: 8
save_steps: 0
logging_steps: 1
eval_split: 0.0
seed: 42
deterministic: true
progress: false
block_major_accumulation: true
path: efficient
block_size: 4
nf4_dequant_cache_mb: 0
offload_embeddings_and_head: true
